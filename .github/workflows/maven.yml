name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create the database and seed the test data
        run: |
          mysql -h 127.0.0.1 -uroot -pci_root_password < db/schema.sql
          mysql -h 127.0.0.1 -uroot -pci_root_password < db/seed.sql
          mysql -h 127.0.0.1 -uroot -pci_root_password < db/queries.sql

      - name: Write the CI database config
        run: |
          cp src/main/resources/config.example.properties src/main/resources/config.properties
          sed -i 's|^db.user=.*|db.user=root|' src/main/resources/config.properties
          sed -i 's|^db.password=.*|db.password=ci_root_password|' src/main/resources/config.properties
          sed -i 's|localhost|127.0.0.1|' src/main/resources/config.properties

      - name: Run the test suite
        run: mvn -B clean test
